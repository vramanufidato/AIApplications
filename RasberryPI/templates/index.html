<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Car Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 80%; max-width: 800px; background: #2d2d2d; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status-panel { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 20px; background: #3d3d3d; border-radius: 10px; }
        .status-item { text-align: center; }
        .status-value { font-size: 1.5em; font-weight: bold; color: #00ff88; }
        .upload-section { margin-top: 30px; border: 2px dashed #555; padding: 20px; text-align: center; border-radius: 10px; transition: 0.3s; }
        .upload-section:hover { border-color: #00ff88; }
        .btn { padding: 10px 20px; background: #00ff88; color: #1a1a1a; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-stop { background: #ff4444; color: white; margin-top: 10px; }
        .logs { margin-top: 20px; height: 150px; overflow-y: auto; background: #000; padding: 10px; font-family: monospace; border-radius: 5px; color: #aaa; }
        .log-entry { margin-bottom: 5px; }
        .toggle-container { margin-bottom: 20px; }
        #preview { max-width: 100%; margin-top: 20px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Autonomous Car Dashboard</h1>
        
        <div class="toggle-container">
            <label>
                <input type="checkbox" id="googleVisionToggle"> Use Google Cloud Vision
            </label>
        </div>

        <div class="status-panel">
            <div class="status-item">
                <div>Model Status</div>
                <div id="carStatus" class="status-value">Stopped</div>
            </div>
            <div class="status-item">
                <div>Pins Active</div>
                <div id="activePins" class="status-value">-</div>
            </div>
        </div>

        <div class="upload-section">
            <h3>📷 Live Camera & Feed Simulation</h3>
            
            <div id="cameraContainer" style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 15px;">
                <!-- Live Video Element -->
                <div class="video-wrapper" style="position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; background: #111; border-radius: 8px; overflow: hidden; display: none; border: 2px solid #555;">
                    <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
                    <div style="position: absolute; top: 10px; left: 10px; background: rgba(255,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; color: white; display: flex; align-items: center; gap: 5px;">
                        <span style="width: 8px; height: 8px; background: white; border-radius: 50%; display: inline-block; animation: blink 1s infinite;"></span>
                        LIVE FEED
                    </div>
                </div>

                <!-- Preview of captured image -->
                <img id="preview" style="max-width: 100%; max-height: 360px; border-radius: 8px; display: none; border: 2px solid #00ff88;">

                <div class="button-group" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn" id="startCamBtn" onclick="startCamera()">Start Webcam</button>
                    <button class="btn" id="captureBtn" onclick="captureSnapshot()" style="display: none; background: #00bcd4; color: white;">Capture Snapshot</button>
                    <button class="btn" id="stopCamBtn" onclick="stopCamera()" style="display: none; background: #777; color: white;">Stop Webcam</button>
                    
                    <input type="file" id="imageInput" accept="image/*" style="display:none">
                    <button class="btn" id="uploadFileBtn" onclick="document.getElementById('imageInput').click()" style="background: #e91e63; color: white;">Upload Image</button>
                </div>
            </div>
            <canvas id="captureCanvas" style="display: none;"></canvas>
        </div>

        <button class="btn btn-stop" onclick="stopCar()">EMERGENCY STOP</button>

        <div class="logs" id="logs">
            <div class="log-entry">> Dashboard initialized. Live camera controls added.</div>
        </div>
    </div>

    <style>
        @keyframes blink {
            50% { opacity: 0; }
        }
        .video-wrapper {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
    </style>

    <script>
        const imageInput = document.getElementById('imageInput');
        const googleVisionToggle = document.getElementById('googleVisionToggle');
        const webcam = document.getElementById('webcam');
        const preview = document.getElementById('preview');
        const videoWrapper = document.querySelector('.video-wrapper');
        const startCamBtn = document.getElementById('startCamBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopCamBtn = document.getElementById('stopCamBtn');
        const canvas = document.getElementById('captureCanvas');
        
        let localStream = null;

        googleVisionToggle.onchange = async () => {
            await fetch('/toggle_vision', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: googleVisionToggle.checked })
            });
            addLog(`Vision system switched to: ${googleVisionToggle.checked ? 'Google Cloud' : 'OpenCV'}`);
        };

        // Start local webcam stream
        async function startCamera() {
            try {
                addLog("Requesting access to HP True Vision FHD Camera / system webcam...");
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }
                });
                webcam.srcObject = localStream;
                videoWrapper.style.display = 'block';
                preview.style.display = 'none';
                
                startCamBtn.style.display = 'none';
                captureBtn.style.display = 'inline-block';
                stopCamBtn.style.display = 'inline-block';
                addLog("Camera started successfully.");
            } catch (err) {
                addLog(`Error starting camera: ${err.message}`);
                console.error("Camera access error:", err);
            }
        }

        // Stop local webcam stream
        function stopCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            webcam.srcObject = null;
            videoWrapper.style.display = 'none';
            
            startCamBtn.style.display = 'inline-block';
            captureBtn.style.display = 'none';
            stopCamBtn.style.display = 'none';
            addLog("Camera stopped.");
        }

        // Capture snapshot from video stream and upload it
        function captureSnapshot() {
            if (!localStream) {
                addLog("Camera stream not available.");
                return;
            }

            const ctx = canvas.getContext('2d');
            canvas.width = webcam.videoWidth || 640;
            canvas.height = webcam.videoHeight || 480;
            
            // Mirror back to match mirrored view preview
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
            
            // Reset transformation for safety
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Convert to Blob and send
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    addLog("Error creating image blob from video frame.");
                    return;
                }
                
                // Show captured image preview
                const url = URL.createObjectURL(blob);
                preview.src = url;
                preview.style.display = 'block';
                videoWrapper.style.display = 'none';
                
                addLog("Uploading captured snapshot...");
                
                // Keep stream active in background or stop it? Let's keep it active but swap visibility
                await uploadAndProcessImage(blob, "snapshot.png");
            }, 'image/png');
        }

        // Local file picker fallback
        imageInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Stop camera if running to focus on uploaded file
            stopCamera();

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            addLog(`Processing uploaded file: ${file.name}...`);
            await uploadAndProcessImage(file, file.name);
        };

        // Shared upload function
        async function uploadAndProcessImage(fileOrBlob, filename) {
            const formData = new FormData();
            formData.append('image', fileOrBlob, filename);

            try {
                const res = await fetch('/process_image', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.error) {
                    addLog(`Error: ${data.error}`);
                    return;
                }

                addLog(`Detected: ${data.detections.join(', ')}`);
                addLog(`Command: ${data.command}`);
                updateStatus();
            } catch (err) {
                addLog(`Upload error: ${err.message}`);
            }
        }

        async function updateStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                document.getElementById('carStatus').innerText = data.status;
                
                const activePins = Object.entries(data.pins)
                    .filter(([p, v]) => v === 1)
                    .map(([p, v]) => p)
                    .join(', ') || 'None';
                document.getElementById('activePins').innerText = activePins;
            } catch (err) {
                console.error("Status check failed:", err);
            }
        }

        async function stopCar() {
            await fetch('/stop', { method: 'POST' });
            addLog("EMERGENCY STOP TRIGGERED");
            updateStatus();
        }

        function addLog(msg) {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `> [${new Date().toLocaleTimeString()}] ${msg}`;
            logs.insertBefore(entry, logs.firstChild);
        }

        // Poll status every 2 seconds
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
